[versions]
kotlin = "2.3.10"
agp = "8.13.2"  # https://maven.google.com/web/index.html?q=gradle.plugin#com.android.library:com.android.library.gradle.plugin
compileSdk = "36"
minSdk = "23"
androidx-compose-ui = "1.11.0-rc01"   # https://developer.android.com/jetpack/androidx/releases/compose-ui
androidx-compose-ui-material3 = "1.5.0-alpha17"  # https://developer.android.com/jetpack/androidx/releases/compose-material3
androidx-compose-ui-material-ripple = "1.7.8"  # https://developer.android.com/jetpack/androidx/releases/compose-material
androidx-compose-ui-material-icons = "1.7.8"  # https://developer.android.com/jetpack/androidx/releases/compose-material
androidx-activity = "1.13.0"  # https://developer.android.com/jetpack/androidx/releases/activity
androidx-appcompat = "1.7.1"
flexmark = "0.64.8"
kotlinx-coroutines = "1.10.2"
kotlin-codepoints = "0.11.0"   # https://github.com/cketti/kotlin-codepoints/releases
junit = "4.13.2"
truth = "1.4.5"
assertk = "0.28.1"
turbine = "1.2.1" # https://github.com/cashapp/turbine/releases
paparazzi = "2.0.0-alpha02" # https://github.com/cashapp/paparazzi/releases
robolectric = "4.16.1" # https://github.com/robolectric/robolectric/releases
dropshots = "0.6.0" # https://github.com/dropbox/dropshots/releases
androidx-benchmark = "1.4.1" # https://developer.android.com/jetpack/androidx/releases/benchmark
androidx-test = "1.7.0" # https://developer.android.com/jetpack/androidx/releases/test
androidx-test-ext-junit = "1.3.0"
androidx-test-uiautomator = "2.3.0" # https://developer.android.com/jetpack/androidx/releases/test-uiautomator
androidx-tracing = "1.3.0" # https://developer.android.com/jetpack/androidx/releases/tracing
mavenPublish = "0.36.0"
composeLintChecks = "1.4.2" # https://github.com/slackhq/compose-lints/releases
errorprone = "2.41.0"
poko = "0.20.2"
touchrobot = "0.1.0" # https://github.com/saket/touch-robot/releases

[libraries]
androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "androidx-compose-ui" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "androidx-compose-ui" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "androidx-compose-ui" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "androidx-compose-ui-material3" }
androidx-compose-material-ripple = { module = "androidx.compose.material:material-ripple", version.ref = "androidx-compose-ui-material-ripple" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "androidx-compose-ui-material-icons" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
flexmark-java = { module = "com.vladsch.flexmark:flexmark-java", version.ref = "flexmark" }
flexmark-ext-gfm-strikethrough = { module = "com.vladsch.flexmark:flexmark-ext-gfm-strikethrough", version.ref = "flexmark" }
flexmark-ext-gfm-tasklist = { module = "com.vladsch.flexmark:flexmark-ext-gfm-tasklist", version.ref = "flexmark" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlin-codepoints-deluxe = { module = "de.cketti.unicode:kotlin-codepoints-deluxe", version.ref = "kotlin-codepoints" }
junit = { module = "junit:junit", version.ref = "junit" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
assertk = { module = "com.willowtreeapps.assertk:assertk", version.ref = "assertk" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
composeLintChecks = { module = "com.slack.lint.compose:compose-lint-checks", version.ref = "composeLintChecks" }
dropshots = { module = "com.dropbox.dropshots:dropshots", version.ref = "dropshots" }
androidx-benchmark-junit4 = { module = "androidx.benchmark:benchmark-junit4", version.ref = "androidx-benchmark" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "androidx-benchmark" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidx-test-uiautomator" }
androidx-tracing-ktx = { module = "androidx.tracing:tracing-ktx", version.ref = "androidx-tracing" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidx-test" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "androidx-compose-ui" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidx-compose-ui" }
errorprone-annotations = { module = "com.google.errorprone:error_prone_annotations", version.ref = "errorprone" }
poko-annotations = { module = "dev.drewhamilton.poko:poko-annotations", version.ref = "poko" }
touchrobot = { module = "me.saket.touchrobot:touchrobot-paparazzi", version.ref = "touchrobot" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
paparazzi = { id = "app.cash.paparazzi", version.ref = "paparazzi" }
dropshots = { id = "com.dropbox.dropshots", version.ref = "dropshots" }
poko = { id = "dev.drewhamilton.poko", version.ref = "poko" }
