apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.vanniktech.maven.publish'
apply plugin: 'app.cash.paparazzi'

android {
  namespace "me.saket.wysiwyg"
  resourcePrefix "wysiwyg_"

  compileSdk versions.compileSdk
  defaultConfig.minSdk 21

  buildFeatures {
    compose = true
    buildConfig = true
  }
  kotlinOptions {
    jvmTarget = "17"
  }
  java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(17))
  }
  lint {
    abortOnError true
  }
}

dependencies {
  api "com.vladsch.flexmark:flexmark-java:$versions.flexmark"
  api "com.vladsch.flexmark:flexmark-ext-gfm-strikethrough:$versions.flexmark"
  api "me.saket.extendedspans:extendedspans:1.3.0"

  implementation "androidx.compose.ui:ui:$versions.composeUi"
  implementation "androidx.compose.foundation:foundation:$versions.composeUi"

  testImplementation "junit:junit:4.13.2"
  testImplementation "com.google.truth:truth:1.4.4"
}
