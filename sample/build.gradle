plugins {
  alias(libs.plugins.android.application)
  alias(libs.plugins.kotlin.android)
  alias(libs.plugins.kotlin.compose)
}

android {
  namespace "me.saket.wysiwyg.sample"
  compileSdk libs.versions.compileSdk.get().toInteger()

  defaultConfig {
    applicationId "me.saket.wysiwyg.sample"
    minSdk 31
    targetSdk 36
    versionCode 1
    versionName "1.0"
  }

  buildFeatures {
    compose = true
    buildConfig = true
  }

  // Produce one APK per ABI rather than a universal one containing every .so.
  splits {
    abi {
      enable true
      reset()
      include "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
      universalApk false
    }
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(17))
  }

  lint {
    abortOnError true
  }
}

dependencies {
  implementation project(':wysiwyg')
  implementation project(':wysiwyg-parser-treesitter')
  implementation libs.androidx.appcompat
  implementation libs.androidx.activity.compose
  implementation libs.androidx.compose.ui
  implementation libs.androidx.compose.foundation
  implementation libs.androidx.compose.material3
  implementation libs.androidx.compose.material.icons.extended
}
