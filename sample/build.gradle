apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
  namespace "me.saket.wysiwyg.sample"
  compileSdk versions.compileSdk

  defaultConfig {
    applicationId "me.saket.wysiwyg.sample"
    minSdk 26
    targetSdk versions.compileSdk
    versionCode 1
    versionName "1.0"
  }

  buildFeatures {
    compose = true
    buildConfig = true
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(17))
  }

  lint {
    abortOnError true
  }
}

dependencies {
  implementation project(':wysiwyg')
  implementation "androidx.appcompat:appcompat:1.7.0"
  implementation "androidx.activity:activity-compose:1.9.3"
  implementation "androidx.compose.ui:ui:$versions.composeUi"
  implementation "androidx.compose.foundation:foundation:$versions.composeUi"
  implementation "androidx.compose.material3:material3:1.3.1"
  implementation "androidx.compose.material:material-icons-extended:$versions.composeUi"
}
