grammar {
  baseDir = file("tree-sitter-markdown/tree-sitter-markdown")
  grammarName = "markdown"
  className = "TreeSitterMarkdown"
  packageName = "me.saket.wysiwyg.parser.treesitter.grammar"
  files = [
    file("tree-sitter-markdown/tree-sitter-markdown/src/parser.c"),
    file("tree-sitter-markdown/tree-sitter-markdown/src/scanner.c"),
  ] as File[]
}

android {
  namespace "me.saket.wysiwyg.parser.treesitter"

  compileSdk libs.versions.compileSdk.get().toInteger()
  defaultConfig {
    minSdk 23
    // targetSdk has no effect on library modules, but it IS used for the test APK. Without it,
    // the test APK inherits minSdk as targetSdk, which degrades Compose rendering and triggers
    // the "built for an older version of Android" platform warning dialog. See
    // https://issuetracker.google.com/issues/283219177.
    targetSdk libs.versions.compileSdk.get().toInteger()
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    externalNativeBuild {
      cmake {
        arguments += [
          "-DGRAMMAR_DIR=${projectDir}/tree-sitter-markdown/tree-sitter-markdown",
          "-DGRAMMAR_INLINE_DIR=${projectDir}/tree-sitter-markdown/tree-sitter-markdown-inline",
          "-DGENERATED_DIR=${layout.buildDirectory.get()}/generated",
        ]
      }
    }
  }

  buildFeatures {
    compose = true
  }

  externalNativeBuild {
    cmake {
      path = file("CMakeLists.txt")
      version = "3.22.1"
    }
  }

  java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(17))
  }
  lint {
    abortOnError true
  }
}

// Auto-initialize the tree-sitter-markdown git submodule on first build so contributors
// don't have to remember `git submodule update --init`. Runs only when the grammar source
// is missing AND this is a git checkout (not a source-only tarball).
def grammarSourceFile = file("tree-sitter-markdown/tree-sitter-markdown/src/parser.c")
if (!grammarSourceFile.exists() && new File(rootDir, ".git").exists()) {
  println "Initializing git submodules (fetching tree-sitter-markdown grammar source)..."
  def proc = new ProcessBuilder("git", "submodule", "update", "--init", "--recursive")
    .directory(rootDir)
    .inheritIO()
    .start()
  if (proc.waitFor() != 0) {
    throw new GradleException("Failed to initialize git submodules. Run `git submodule update --init --recursive` manually.")
  }
}

// The ktreesitter plugin adds build/generated/src/**/kotlin as Kotlin srcDirs and writes binding.c
// into build/generated/src/jni. Kotlin compile tasks and CMake configure/build tasks all need
// generateGrammarFiles to run first.
def generateGrammarFiles = tasks.named("generateGrammarFiles")
tasks.matching {
  it.name.startsWith("compile") && it.name.contains("Kotlin")
    || it.name.startsWith("configureCMake")
    || it.name.startsWith("buildCMake")
}.configureEach { dependsOn(generateGrammarFiles) }
